<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Cubes</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Create scene, camera, and renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);

    // Create blocks
    function createBlock(x, y, z, color) {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshLambertMaterial({ color: color });
      const block = new THREE.Mesh(geometry, material);
      block.position.set(x, y, z);
      return block;
    }

    // Add blocks to the scene
    for (let x = -5; x < 5; x++) {
      for (let z = -5; z < 5; z++) {
        scene.add(createBlock(x, 0, z, 0x8B4513)); // Dirt block
        if (Math.random() > 0.8) {
          scene.add(createBlock(x, 1, z, 0x32CD32)); // Grass block
        }
      }
    }

    // Create trees
    function createTree(x, z) {
      for (let y = 1; y < 3; y++) {
        scene.add(createBlock(x, y, z, 0x8B4513)); // Tree trunk
      }
      scene.add(createBlock(x, 3, z, 0x228B22)); // Tree top
      scene.add(createBlock(x - 1, 3, z, 0x228B22));
      scene.add(createBlock(x + 1, 3, z, 0x228B22));
      scene.add(createBlock(x, 3, z - 1, 0x228B22));
      scene.add(createBlock(x, 3, z + 1, 0x228B22));
    }

    createTree(0, 0);
    createTree(2, 2);

    // Position the camera
    camera.position.set(5, 5, 5);
    camera.lookAt(0, 0, 0);

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
